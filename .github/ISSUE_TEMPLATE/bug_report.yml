name: Bug report / Signaler un bug
description: Something does not work / Quelque chose ne fonctionne pas
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a dock or overlay address: it contains your key (`?key=…`), or your tokens.**
        **Ne colle jamais l'adresse d'un dock ou de l'overlay : elle contient ta clé (`?key=…`), ni tes jetons.**
        A question rather than a bug? / Plutôt une question ? → [Discussions](https://github.com/Tramevia/Tramevia-Dock/discussions)
  - type: textarea
    id: what
    attributes:
      label: What happened? What did you expect? / Que s'est-il passé ? Qu'attendais-tu ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Étapes pour reproduire
      placeholder: "1. …\n2. …\n3. …"
  - type: input
    id: version
    attributes:
      label: Tramevia Dock version / Version de Tramevia Dock
      description: Settings → About / Paramètres → À propos
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options: [ZIP (start.bat / start.command / start.sh), Docker, Railway, git clone, Other / Autre]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and OBS version / Système et version d'OBS
      placeholder: "Windows 11, OBS 31.1"
  - type: dropdown
    id: platform
    attributes:
      label: Platform / Plateforme
      multiple: true
      options: [Twitch, Kick, YouTube, TikTok, OBS, Other / Autre]
  - type: dropdown
    id: where
    attributes:
      label: Where? / Où ?
      multiple: true
      options: [Dashboard / Tableau de bord, Setup wizard / Assistant, Chat dock, Events / Événements, Community / Communauté, Stream info / Infos du live, Overlay, Updates / Mises à jour, Other / Autre]
  - type: textarea
    id: logs
    attributes:
      label: Logs (the black window, or Railway → Deployments → View logs) / Journaux (fenêtre noire, ou Railway → Deployments → View logs)
      description: Remove any token, key or password! / Retire tout jeton, clé ou mot de passe !
      render: text
