# Push a v* tag to release (see RELEASING.md): multi-arch image on GHCR, update bundle + zip, GitHub release.
# One trigger on purpose: a release created with GITHUB_TOKEN does not trigger `release: published` workflows,
# and immutable releases refuse assets added after publication.
name: Release
on:
  push:
    tags: ['v*']          # v1.2.3 = release, v1.3.0-rc.1 = pre-release
permissions: {}
env:
  IMAGE: ghcr.io/tramevia/tramevia-dock   # lowercase, hardcoded (never derive from github.repository)

jobs:
  image:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Tag must match package.json
        # v1.3.0-rc.1 is tagged on the release commit itself, so the pre-release suffix is ignored here.
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME%%-*}"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index   # GHCR reads the description from the index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ !contains(github.ref_name, '-') }}   # pre-releases are built (tested) but never pushed
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      # --no-bin-links: no node_modules/.bin symlinks, which Windows tar cannot always extract.
      - run: npm ci --omit=dev --ignore-scripts --no-bin-links --no-audit --no-fund
      - name: Build bundles and notes
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -qU $'\r' start.bat || { echo "start.bat lost its CRLF line endings (.gitattributes): cmd's goto needs them"; exit 1; }
          F="src public node_modules package.json package-lock.json start.bat start.sh start.command demo.bat .env.example LICENSE README.md README.fr.md CHANGELOG.md"
          tar -czf "tramevia-dock-$V.tar.gz" --owner=0 --group=0 --numeric-owner $F   # read by the in-app updater (entries at top level)
          mkdir -p z/Tramevia-Dock && cp -r $F z/Tramevia-Dock/ && (cd z && zip -qr "../tramevia-dock-$V.zip" Tramevia-Dock)  # for people
          awk -v v="${V%%-*}" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md needs a '## ${V%%-*}' section"; exit 1; }
      - name: Publish (draft -> assets -> publish, required by immutable releases)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag $PRE \
            --title "Tramevia Dock ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            tramevia-dock-*.tar.gz tramevia-dock-*.zip
          gh release edit "$GITHUB_REF_NAME" --draft=false
